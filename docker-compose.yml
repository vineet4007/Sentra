services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.1.1
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    command: ["--config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro

  tempo:
    image: grafana/tempo:2.6.1
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["--config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # HTTP

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      SENTRA_AI_ENABLED: ${SENTRA_AI_ENABLED:-true}
      SENTRA_AI_URL: ${SENTRA_AI_URL:-http://ai:8000}
      SENTRA_AI_TIMEOUT_SEC: ${SENTRA_AI_TIMEOUT_SEC:-3}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    command: ["npm", "run", "start"]

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      SENTRA_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  controller:
    build:
      context: ./services/controller
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      SATELLITE_ENABLED: ${SATELLITE_ENABLED:-false}
      SATELLITE_NAME: ${SATELLITE_NAME:-local-satellite}
      SATELLITE_MODE: ${SATELLITE_MODE:-satellite}
      SATELLITE_CLOUD: ${SATELLITE_CLOUD:-}
      SATELLITE_REGION: ${SATELLITE_REGION:-}
      SATELLITE_CLUSTER: ${SATELLITE_CLUSTER:-}
      SATELLITE_ENDPOINT_URL: ${SATELLITE_ENDPOINT_URL:-}
      SATELLITE_VERSION: ${SATELLITE_VERSION:-dev}
      SATELLITE_COORDINATOR_URL: ${SATELLITE_COORDINATOR_URL:-}
      SATELLITE_COORDINATOR_TOKEN: ${SATELLITE_COORDINATOR_TOKEN:-}
      SATELLITE_TENANT_KEY: ${SATELLITE_TENANT_KEY:-}
      SATELLITE_TENANT_HEADER: ${SATELLITE_TENANT_HEADER:-x-sentra-tenant}
      SATELLITE_HEARTBEAT_INTERVAL_SEC: ${SATELLITE_HEARTBEAT_INTERVAL_SEC:-30}
      SATELLITE_COORDINATOR_TIMEOUT_SEC: ${SATELLITE_COORDINATOR_TIMEOUT_SEC:-5}
      SATELLITE_TASKS_ENABLED: ${SATELLITE_TASKS_ENABLED:-false}
      SATELLITE_TASK_POLL_INTERVAL_SEC: ${SATELLITE_TASK_POLL_INTERVAL_SEC:-5}
      SATELLITE_TASK_LEASE_SEC: ${SATELLITE_TASK_LEASE_SEC:-30}
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    command: ["/app/controller"]

volumes:
  mysql_data:
  redis_data:
  loki_data:
  tempo_data:
